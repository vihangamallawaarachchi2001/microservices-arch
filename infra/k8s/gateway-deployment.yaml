# infra/k8s/gateway-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: vihanm0120/gateway:latest
          ports:
            - containerPort: 3000
          env:
            - name: JWT_SECRET
              value: "sksvDeveloper"
            - name: SMTP_SERVER
              value: "smtp-relay.brevo.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_LOGIN
              value: "vihanganethusara00@gmail.com"
            - name: SMTP_KEY
              value: "xsmtpsib-..."
            - name: STRIPE_SECRET_KEY
              value: "sk_test_..."
            - name: AUTH_SERVICE
              value: "http://auth-service:3001"
            - name: USER_SERVICE
              value: "http://user-service:3002"
            - name: HOTEL_SERVICE
              value: "http://restaurant-service:3003"
            - name: REVIEW_SERVICE
              value: "http://review-service:3004"
            - name: ORDER_SERVICE
              value: "http://order-service:3005"

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000